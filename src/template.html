<title>Three Clocks, One Millennium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Big+Shoulders+Display:wght@800;900&family=Schibsted+Grotesk:wght@400;500;700;800&family=UnifrakturMaguntia&display=swap">
<link rel="stylesheet" href="__KANJI_FONT__">
<style>
:root {
  /* Layout: three stacked lanes (one per country) share a single rolling year counter;
     a 1,000-year era map along the bottom shows how the eras overlap. */
  --bg: #E3E6EA;        /* page */
  --stage: #F0F2F4;     /* film frame */
  --surface: #FAFBFC;   /* lane strips */
  --fg: #12141A;
  --muted: #565D6B;
  --line: #CBD0D8;
  --jp: #CC3A24;  --on-jp: #FFFFFF;   /* shu vermilion */
  --us: #213E8C;  --on-us: #FFFFFF;   /* navy */
  --de: #E2AA0A;  --on-de: #15130E;   /* gold */
  --night: #0B0C0F; --night-fg: #E8E8EA;
  --f-ja-sans: 'Noto Sans JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo;
  --f-display: 'Big Shoulders Display', 'Arial Narrow', Impact, var(--f-ja-sans), sans-serif;
  --f-body: 'Schibsted Grotesk', var(--f-ja-sans), system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-us: 'Alfa Slab One', Rockwell, 'Roboto Slab', Georgia, var(--f-ja-sans), serif;
  --f-de: 'UnifrakturMaguntia', 'Old English Text MT', 'Times New Roman', serif;
  --f-jp: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0D11; --stage: #12151B; --surface: #191D24; --fg: #ECEEF1; --muted: #9DA4B1; --line: #2A3039;
    --jp: #E0533B; --us: #4E76D8; --de: #EDB820; --night: #050608; --night-fg: #E8E8EA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0D11; --stage: #12151B; --surface: #191D24; --fg: #ECEEF1; --muted: #9DA4B1; --line: #2A3039;
  --jp: #E0533B; --us: #4E76D8; --de: #EDB820; --night: #050608; --night-fg: #E8E8EA;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body);
  padding-inline: 16px; padding-block: 16px; box-sizing: border-box;
  overflow-x: hidden;
}
.app { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.app:fullscreen { background: var(--bg); justify-content: center; padding: 16px; box-sizing: border-box; }

/* ---------- stage ---------- */
.viewport { position: relative; max-width: 100%; }
.stage {
  --d: 0;
  --ink: color-mix(in oklab, var(--fg), var(--night-fg) calc(var(--d) * 100%));
  --muted-ink: color-mix(in oklab, var(--muted), #8E95A1 calc(var(--d) * 100%));
  --surf: color-mix(in oklab, var(--surface), #1B1D22 calc(var(--d) * 100%));
  --stage-now: color-mix(in oklab, var(--stage), var(--night) calc(var(--d) * 100%));
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  width: 1280px; height: 720px; overflow: hidden;
  border-radius: 16px; border: 1px solid var(--line); box-sizing: border-box;
  background: var(--stage-now);
  color: var(--ink);
  cursor: pointer; user-select: none; -webkit-user-select: none;
}
.shaker { position: absolute; inset: 0; padding: 22px 28px 20px; display: flex; flex-direction: column; gap: 12px; }

/* header: the shared clock */
.head { position: relative; flex: none; height: 128px; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 34px; }
.clock { display: flex; flex-direction: column; }
.odo { display: flex; font-family: var(--f-display); font-weight: 900; font-size: 116px; line-height: 1; }
.digit { width: .56em; height: .9em; overflow: hidden; text-align: center; }
.strip { will-change: transform; }
.strip span { display: block; height: .9em; line-height: .9em; font-variant-numeric: tabular-nums; }
.range { margin-top: 6px; font-size: 14px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted-ink); min-height: 1.2em; }
.caption { margin: 0; max-width: 620px; font-size: 30px; font-weight: 700; line-height: 1.18; letter-spacing: -.012em; text-wrap: balance; }
.stamp {
  position: absolute; right: 8px; top: 50%; opacity: 0; white-space: nowrap;
  font-family: var(--f-display); font-weight: 900; font-size: 34px; letter-spacing: .05em; text-transform: uppercase; line-height: 1;
  padding: 8px 16px 6px; border: 4px solid currentColor; border-radius: 10px;
  box-shadow: inset 0 0 0 2px var(--stage-now), inset 0 0 0 4px currentColor;
}

/* lanes */
.lanes { position: relative; flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px; }
.lane { --c: var(--jp); --on: var(--on-jp); display: grid; grid-template-columns: 206px minmax(0, 1fr); border-radius: 12px; overflow: hidden; min-height: 0;
  background: color-mix(in oklab, var(--c) 7%, var(--surf)); filter: grayscale(calc(var(--d) * .9)); }
.lane[data-r="us"] { --c: var(--us); --on: var(--on-us); }
.lane[data-r="de"] { --c: var(--de); --on: var(--on-de); }
.name { background: var(--c); color: var(--on); padding: 12px 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-width: 0; }
.mark { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.mark .kanji { font-family: var(--f-jp); font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: .04em; }
.mark .latin { font-size: 12px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
.mark.us, .mark.de { flex-direction: column; align-items: flex-start; gap: 0; }
.mark .wm { line-height: 1; }
.mark.us .wm { font-family: var(--f-us); font-size: 31px; }
.mark.de .wm { font-family: var(--f-de); font-size: 34px; }
.mark small { display: block; margin-top: 4px; font-family: var(--f-body); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.mark small:empty, .mark .latin:empty { display: none; }
.era { align-self: flex-start; max-width: 100%; box-sizing: border-box; font-size: 13px; font-weight: 700; line-height: 1.25; padding: 4px 10px; border-radius: 8px;
  background: color-mix(in oklab, var(--on) 17%, transparent); }
.era .ek { font-family: var(--f-jp); font-weight: 800; margin-right: 6px; }
.era .es { display: block; font-weight: 500; opacity: .85; }
.era.flip { animation: flip .38s ease-out; }
@keyframes flip { from { transform: translateY(6px); opacity: .2; } to { transform: none; opacity: 1; } }

.slot { position: relative; min-width: 0; overflow: hidden; display: flex; align-items: center; padding: 0 70px 0 22px; }
.card { display: flex; align-items: center; gap: 22px; min-width: 0; will-change: transform, opacity; opacity: 0; }
.tag { flex: none; box-sizing: border-box; width: 124px; padding: 8px 8px; text-align: center; font-size: 17px; font-weight: 800; line-height: 1.15; }
.lane[data-r="jp"] .tag { color: var(--c); border: 3px solid var(--c); border-radius: 7px; outline: 1.5px solid var(--c); outline-offset: -8px; padding: 12px 10px; transform: rotate(-4deg);
  background: color-mix(in oklab, var(--c) 6%, var(--surf)); }
.lane[data-r="us"] .tag { background: var(--c); color: var(--on); font-family: var(--f-us); font-weight: 400; padding: 11px 12px;
  -webkit-mask: radial-gradient(circle 7px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 7px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 7px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 7px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat; }
.lane[data-r="de"] .tag { background: var(--c); color: var(--on); padding: 10px 8px; box-shadow: 4px 4px 0 var(--ink); }
.tag:empty { visibility: hidden; }
.txt { min-width: 0; }
.txt h3 { margin: 0; font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -.016em; text-wrap: balance; }
.txt p { margin: 5px 0 0; max-width: 64ch; font-size: 20px; line-height: 1.32; color: color-mix(in oklab, var(--ink) 76%, var(--surf)); text-wrap: pretty; }
.ill { position: absolute; right: 86px; top: 50%; width: 136px; height: 113px; margin-top: -57px; opacity: 0; overflow: visible; pointer-events: none;
  color: color-mix(in oklab, var(--c) 80%, var(--ink)); fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.ill :is(path, circle, rect, ellipse, line, polyline, polygon) { stroke-dasharray: 1 1; stroke-dashoffset: var(--draw, 0); }
.ill .f, .ill .f * { fill: currentColor; fill-opacity: calc(.2 * var(--fill, 1)); stroke: none; }
.ill .s { fill: currentColor; stroke: none; opacity: var(--fill, 1); }
.ill.drawing * { stroke-linecap: butt; } /* round caps leave dots on half-drawn dashes */
.slot.has-ill { padding-right: 236px; }
.card { position: relative; z-index: 1; }

/* media panel: a painting/photo, a map or a chart, fading into the lane on its left edge */
.media { position: absolute; top: 0; right: 0; bottom: 0; width: var(--mw, 42%); overflow: hidden; opacity: 0; pointer-events: none; background: #0d1520;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade, 26%)); mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade, 26%)); }
.media:empty { display: none; }
.media .kb { position: absolute; inset: 0; overflow: hidden; }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; will-change: transform; }
.media svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.media .credit { position: absolute; right: 9px; bottom: 6px; max-width: 76%; z-index: 1; font: 600 9.5px/1.25 var(--f-body); letter-spacing: .02em;
  color: rgba(255, 255, 255, .92); text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 6px rgba(0, 0, 0, .5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.media .draw { stroke-dasharray: 1 1; stroke-dashoffset: var(--draw, 0); }
.media .fillin { opacity: var(--fill, 1); }
.media .pin { opacity: var(--fill, 1); }
.media .grow { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(calc(1 - var(--draw, 0))); }
.media .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .media .pulse { animation: none; opacity: 0; } }
.slot.has-media { padding-right: calc(var(--mw, 42%) - 34px); }
.slot.has-media .ill { display: none; }
.slot.has-media .card { gap: 18px; }
.slot.has-media .tag { width: 112px; }
.slot.has-media .txt h3 { font-size: 27px; }
.slot.has-media .txt p { font-size: 18.5px; line-height: 1.3; }

/* credits screen */
.credits-card { background: var(--stage); justify-content: flex-start; gap: 12px; padding: 40px 76px 36px; cursor: default; user-select: text; -webkit-user-select: text; }
.cr-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; }
.cr-head h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 56px; line-height: 1; text-transform: uppercase; }
.cr-intro { margin: 0; color: var(--muted); font-size: 16px; max-width: 70ch; }
.cr-list { margin: 0; padding: 0 8px 0 0; list-style: none; width: 100%; box-sizing: border-box; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 36px; align-content: start; font-size: 13.5px; line-height: 1.4; }
.cr-list li { padding: 4px 0; border-bottom: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.cr-list b { font-variant-numeric: tabular-nums; }
.cr-list a { color: inherit; text-decoration-color: color-mix(in oklab, var(--fg) 40%, transparent); text-underline-offset: 2px; }
.cr-list a:focus-visible { outline: 2px solid var(--us); outline-offset: 2px; }
.big-btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--line); padding: 14px 22px; font-size: 18px; }
.title-card .text-btn { border: 0; background: none; padding: 4px 0; color: var(--muted); font: 700 15px/1 var(--f-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.title-card .text-btn:focus-visible { outline: 3px solid var(--us); outline-offset: 2px; }
.end-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.fxcanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.link { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.link path { fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.link #linkShade { stroke: rgba(0, 0, 0, .42); stroke-width: 8; }
.link circle { fill: #fff; stroke: rgba(0, 0, 0, .45); stroke-width: 2; }

/* era map */
.map { flex: none; display: grid; grid-template-columns: 84px minmax(0, 1fr); column-gap: 10px; }
.labels, .tracks { display: grid; grid-template-rows: 15px 15px 15px 22px; row-gap: 4px; }
.labels span { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; line-height: 15px; color: var(--muted-ink); white-space: nowrap; }
.tracks { position: relative; cursor: pointer; }
.track { --c: var(--jp); --on: var(--on-jp); position: relative; border-radius: 4px; overflow: hidden; background: color-mix(in oklab, var(--c) 12%, var(--surf)); filter: grayscale(calc(var(--d) * .9)); }
.track[data-r="us"] { --c: var(--us); --on: var(--on-us); }
.track[data-r="de"] { --c: var(--de); --on: var(--on-de); }
.seg { position: absolute; top: 0; bottom: 0; box-sizing: border-box; border-right: 1.5px solid var(--surf); padding-left: 5px;
  font-size: 10.5px; font-weight: 700; line-height: 15px; white-space: nowrap; overflow: hidden;
  background: color-mix(in oklab, var(--c) 24%, var(--surf)); color: color-mix(in oklab, var(--c) 55%, var(--ink)); transition: background .25s, color .25s; }
.seg.alt { background: color-mix(in oklab, var(--c) 38%, var(--surf)); }
.seg.on { background: var(--c); color: var(--on); }
.axis { position: relative; }
.axis::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: color-mix(in oklab, var(--ink) 30%, transparent); }
.tick { position: absolute; top: 9px; transform: translateX(-50%); font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted-ink); }
.dot { position: absolute; top: 2px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--stage-now); box-shadow: inset 0 0 0 1.5px var(--muted-ink); }
.dot.past { background: var(--muted-ink); }
.dot.now { width: 11px; height: 11px; top: 0; margin-left: -5.5px; background: var(--ink); box-shadow: none; }
.playhead { position: absolute; top: -4px; height: calc(3 * 15px + 2 * 4px + 8px); width: 3px; margin-left: -1.5px; border-radius: 2px; background: currentColor; pointer-events: none; }
.playhead::before { content: ""; position: absolute; top: -5px; left: -4px; width: 11px; height: 11px; border-radius: 50%; background: currentColor; }

/* overlays */
.overlay { position: absolute; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 18px; padding: 56px 76px; cursor: default; }
.title-card { background: var(--stage); }
.eyebrow { font-size: 15px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.title-card h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 178px; line-height: .8; text-transform: uppercase; letter-spacing: -.005em; }
.title-card h1 span { display: block; }
.title-card .sub { margin: 4px 0 0; max-width: 34ch; font-size: 25px; line-height: 1.3; color: var(--muted); text-wrap: balance; }
.tc-langs { display: flex; gap: 8px; flex-wrap: wrap; }
.tc-langs button { padding: 9px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); font: 700 17px/1 var(--f-body); cursor: pointer; }
.tc-langs button:hover { color: var(--fg); border-color: var(--muted); }
.tc-langs button[aria-pressed="true"] { background: var(--fg); color: var(--stage); border-color: transparent; }
.tc-langs button:focus-visible { outline: 3px solid var(--us); outline-offset: 2px; }
.big-btn { display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px 16px 22px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--fg); color: var(--stage); font: 800 22px/1 var(--f-body); }
.big-btn:hover { transform: translateY(-1px); }
.big-btn:focus-visible { outline: 4px solid var(--us); outline-offset: 3px; }
.big-btn svg { width: 22px; height: 22px; fill: currentColor; }
.faces { position: absolute; right: 56px; top: 50%; width: 380px; height: 360px; transform: translateY(-50%) scale(.9); transform-origin: 100% 50%; pointer-events: none; }
.face { --c: var(--jp); position: absolute; width: 224px; height: 224px; box-sizing: border-box; border-radius: 50%; border: 12px solid var(--c); }
.face.us { --c: var(--us); left: 152px; top: 0; }
.face.jp { left: 0; top: 0; }
.face.de { --c: var(--de); left: 76px; top: 132px; }
.face::after { content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; background: var(--c); }
.face i { position: absolute; left: 50%; bottom: 50%; border-radius: 4px; background: var(--c); transform-origin: 50% 100%; }
.face .h { width: 10px; height: 52px; margin-left: -5px; transform: rotate(var(--ha)); }
.face .m { width: 6px; height: 82px; margin-left: -3px; transform: rotate(var(--ma)); animation: hand var(--sp) linear infinite; }
@keyframes hand { from { transform: rotate(var(--ma)); } to { transform: rotate(calc(var(--ma) + 360deg)); } }
@media (prefers-reduced-motion: reduce) { .face .m { animation: none; } }
.end-card { background: color-mix(in oklab, var(--stage) 93%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; visibility: hidden; }
.end-card h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 128px; line-height: .86; text-transform: uppercase; }
.end-card h2 > span { display: block; }
.end-card h2 .jp { color: var(--jp); } .end-card h2 .us { color: var(--us); } .end-card h2 .de { color: var(--de); }
.end-card .note { margin: 0; max-width: 52ch; font-size: 18px; line-height: 1.4; color: var(--muted); }

/* ---------- per-language typography ---------- */
html:lang(ja) .caption, html:lang(ja) .txt h3, html:lang(ja) .txt p, html:lang(ja) .sub, html:lang(ja) .note, html:lang(ja) .era {
  word-break: auto-phrase; line-break: strict; letter-spacing: 0; }
html:lang(ja) .txt h3, html:lang(ja) .caption { font-weight: 800; }
html:lang(ja) .title-card h1 { font-size: 150px; line-height: 1.04; letter-spacing: .02em; }
html:lang(ja) .end-card h2 { font-size: 104px; line-height: 1.12; }
html:lang(ja) .stamp { font-family: var(--f-body); font-weight: 900; font-size: 30px; letter-spacing: .08em; padding: 9px 16px 8px; }
html:lang(ja) .odo { font-family: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif; }
html:lang(de) .txt p, html:lang(de) .caption { hyphens: auto; -webkit-hyphens: auto; }
html:lang(ja) .mark small, html:lang(ja) .labels span { letter-spacing: .04em; }

/* ---------- portrait layout ---------- */
.stage.portrait .shaker { padding: 26px 24px 22px; gap: 14px; }
.stage.portrait .head { height: 290px; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; row-gap: 14px; align-items: start; }
.stage.portrait .odo { font-size: 140px; }
.stage.portrait .range { font-size: 17px; }
.stage.portrait .caption { grid-column: 1 / -1; max-width: none; font-size: 35px; }
.stage.portrait .stamp { top: 54px; right: 4px; font-size: 28px; padding: 7px 12px 5px; }
.stage.portrait .lanes { gap: 12px; }
.stage.portrait .lane { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.stage.portrait .name { flex-direction: row; align-items: center; justify-content: flex-start; padding: 9px 16px; gap: 16px; }
.stage.portrait .mark .kanji { font-size: 32px; }
.stage.portrait .mark.us, .stage.portrait .mark.de { flex-direction: row; align-items: baseline; gap: 8px; }
.stage.portrait .mark.us .wm { font-size: 27px; }
.stage.portrait .mark.de .wm { font-size: 32px; }
.stage.portrait .mark small { display: inline; margin: 0; }
.stage.portrait .era { align-self: center; font-size: 15px; }
.stage.portrait .era .es { display: inline; }
.stage.portrait .era .es::before { content: " · "; }
.stage.portrait .slot, .stage.portrait .slot.has-ill { padding: 10px 62px 12px 20px; }
.stage.portrait .media { left: 0; width: auto; -webkit-mask-image: none; mask-image: none; }
.stage.portrait .media::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(9, 11, 16, .95) 0%, rgba(9, 11, 16, .86) 48%, rgba(9, 11, 16, .38) 80%, rgba(9, 11, 16, .12) 100%); }
.stage.portrait .media .credit { top: 7px; bottom: auto; right: 10px; font-size: 12px; }
.stage.portrait .slot.has-media { padding: 10px 62px 14px 20px; align-items: flex-end; }
.stage.portrait .slot.has-media .card { color: #fff; gap: 0; column-gap: 16px; }

/* ---------- Soundtrack: synthesized live with Web Audio, no audio files ---------- */
const Sound = (() => {
  let ctx = null, master, groove, padBus, sfx, delay, reverb, noise;

  const BARS = [
    { root: 38, pad: [50, 57, 62, 65], arp: [62, 65, 69, 74] },
    { root: 34, pad: [46, 53, 58, 62], arp: [58, 62, 65, 70] },
    { root: 41, pad: [53, 57, 60, 65], arp: [65, 69, 72, 77] },
    { root: 36, pad: [48, 55, 60, 64], arp: [60, 64, 67, 72] },
  ];
  const ARP = [0, 1, 2, 3, 2, 1, 2, 3, 0, 2, 1, 3, 2, 1, 3, 2];

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = enabled ? .55 : 0;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ctx.destination);
    groove = ctx.createGain(); groove.gain.value = 0; groove.connect(master);
    padBus = ctx.createGain(); padBus.gain.value = 0; padBus.connect(master);
    sfx = ctx.createGain(); sfx.gain.value = .9; sfx.connect(master);
    // echo for the plucks
    delay = ctx.createDelay(1); const fb = ctx.createGain(); fb.gain.value = .32; const wet = ctx.createGain(); wet.gain.value = .28;
    delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(groove);

    reverb = ctx.createConvolver();
    const len = ctx.sampleRate * 1.8, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    reverb.buffer = ir; const rv = ctx.createGain(); rv.gain.value = .35; reverb.connect(rv); rv.connect(master);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    return true;
  }
  const env = (g, t, peak, a, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  function osc(type, f, t, dur, peak, out, a = .005) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    env(g, t, peak, a, dur); o.connect(g); g.connect(out); o.start(t); o.stop(t + a + dur + .05); return o;
  }

    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = filterType; f.frequency.value = freq; f.Q.value = q;
    env(g, t, peak, .002, dur); s.connect(f); f.connect(g); g.connect(out); s.start(t); s.stop(t + dur + .05);
  }
  const kick = t => { const o = osc('sine', 150, t, .32, .9, groove); o.frequency.exponentialRampToValueAtTime(42, t + .12); };
  const clap = t => { noiseHit(t, .14, .32, 'bandpass', 1600, groove, 1.2); noiseHit(t + .012, .1, .2, 'bandpass', 2200, groove, 1.2); };
  const hat = (t, v) => noiseHit(t, .035, v, 'highpass', 7500, groove);
  function bass(t, m, dur) {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; o.frequency.value = mtof(m); f.type = 'lowpass'; f.Q.value = 6;
    f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(220, t + dur);
    env(g, t, .26, .006, dur); o.connect(f); f.connect(g); g.connect(groove); o.start(t); o.stop(t + dur + .05);
  }
  function pluck(t, m) {
    const g = ctx.createGain(); g.connect(groove); g.connect(delay); g.connect(reverb); g.gain.value = 1;
    osc('triangle', mtof(m), t, .22, .085, g); osc('square', mtof(m) * 2, t, .08, .018, g);

    notes.forEach(m => [-6, 6].forEach(det => {
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det; f.type = 'lowpass'; f.frequency.value = 800;

    const bar = BARS[Math.floor(s / 16) % 4], pos = s % 16, sixteenth = 60 / bpm / 4;

      pluck(t, bar.arp[ARP[pos]]);

    if (!ctx || ctx.state !== 'running') return;

    while (nextTime < ahead) { playStep(step, nextTime); nextTime += 60 / bpm / 4; step = (step + 1) % 64; }
  }

      if (ctx.state !== 'running') ctx.resume();
      if (!timer) timer = setInterval(schedule, 25);
      if (fresh) { const m = mood; mood = 'off'; api.setMood(m); }
    },
    setEnabled(on) { enabled = on; if (ctx) fade(master, on ? .55 : 0, .15); },
    setSpeed(x) { bpm = 112 * (1 + (x - 1) * .5); },
    setMood(m) {
      if (!ctx || m === mood) { mood = m; return; }
      const prev = mood; mood = m;
      if (m === 'groove') { step = 0; nextTime = ctx.currentTime + .03; fade(groove, 1, prev === 'dark' ? 1.2 : .05); fade(padBus, 1, .3); }
      else if (m === 'dark') { fade(groove, 0, .9); fade(padBus, 1, .5); step = 0; nextTime = ctx.currentTime + .05; }
      else if (m === 'intro') { fade(groove, 0, .2); fade(padBus, 1, .2); step = 0; nextTime = ctx.currentTime + .03; }
      else if (m === 'end') { fade(groove, 0, 2.5); fade(padBus, .9, .3); pad(ctx.currentTime + .05, [50, 54, 57, 62, 66], 5.5, .03); }
      else { fade(groove, 0, .3); fade(padBus, 0, .3); }
    },
    stampHit() {
      if (!ctx) return; const t = ctx.currentTime + .01;
      const o = osc('sine', 130, t, .25, .8, sfx); o.frequency.exponentialRampToValueAtTime(48, t + .14);
      noiseHit(t, .06, .35, 'lowpass', 1800, sfx);
    },
    rumble(dur = 1.7) {
      if (!ctx) return; const t = ctx.currentTime + .01;
      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      s.buffer = noise; s.loop = true; f.type = 'lowpass'; f.frequency.value = 110;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1.6, t + .15); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(sfx); s.start(t); s.stop(t + dur + .05);
    },
    heartbeat(beats = 3) {
      if (!ctx) return;
      for (let i = 0; i < beats; i++) [0, .24].forEach((d, j) => {
        const t = ctx.currentTime + .02 + i * .82 + d;

    },
  };

})();

  function fillCredits() {
    const items = [];
    SCENES.forEach((s, k) => REGIONS.forEach(r => {
      const m = MEDIA[`${s.year}-${r}`]; if (!m) return;
      const head = L.scenes[s.year][r][1];
      items.push(`<li><b>${s.year}</b> · ${esc(L.ui.mapRows[r])} · ${esc(head)}<br>${esc(m.artist || L.ui.media.unknown)} · <a href="${esc(m.source)}" target="_blank" rel="noopener">${esc(m.license)}</a></li>`);
    }));
    items.push(`<li>${esc(L.ui.media.map)} · <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a></li>`);
    items.push(`<li>${esc(L.ui.media.nikkeiSrc)} · ${esc(L.ui.media.imfSrc)}</li>`);
    $('crList').innerHTML = items.join('');
  }
  function openCredits(on) {
    if (on) { setPlaying(false); fillCredits(); }
    creditsCard.hidden = !on;
    (on ? $('crClose') : (t === 0 ? $('bigPlay') : $('playBtn'))).focus({ preventScroll: true });
  }

  function drawLink(link) {
    linkDots.innerHTML = '';
    if (!link) { linkPath.setAttribute('d', ''); linkShade.setAttribute('d', ''); linkLen = 0; return; }
    const W = lanes.offsetWidth, x = W - 30, arm = 30;
    const els = [...lanes.querySelectorAll('.lane')];
    const ys = REGIONS.map((r, i) => { if (!link.includes(r)) return null; const sl = els[i].querySelector('.slot'); return els[i].offsetTop + sl.offsetTop + sl.offsetHeight / 2; }).filter(v => v !== null);
    const top = ys[0], bot = ys[ys.length - 1];
    let d = `M ${x - arm} ${top} H ${x} V ${bot} H ${x - arm}`;
    ys.slice(1, -1).forEach(y => { d += ` M ${x} ${y} H ${x - arm}`; });
    linkPath.setAttribute('d', d); linkShade.setAttribute('d', d);
    linkDots.innerHTML = ys.map(y => `<circle cx="${x - arm}" cy="${y}" r="6"></circle>`).join('');
    linkLen = linkPath.getTotalLength ? linkPath.getTotalLength() : 600;
    linkPath.style.strokeDasharray = linkLen; linkShade.style.strokeDasharray = linkLen;
  }

  // ---- render ----
  const titleCard = $('titleCard'), endCard = $('endCard'), playhead = $('playhead'), tracksEl = $('tracks');
  let t = 0, playing = false, speed = 1, lastNow = null, dirty = true, dragging = false;
  let prevSeg = -1, prevTau = 0;

  function locate(time) {
    for (let i = SEGS.length - 1; i >= 0; i--) if (time >= SEGS[i].start) return { i, tau: time - SEGS[i].start };
    return { i: 0, tau: 0 };
  }
  // sound cues fire when playback crosses a moment inside a segment
  function cues(i, tau) {
    const seg = SEGS[i];
    const crossed = at => playing && i === prevSeg && prevTau < at && tau >= at;
    Sound.setMood(seg.type === 'title' ? 'intro' : seg.type === 'end' ? 'end' : SCENES[seg.k].fx === 'dark' ? 'dark' : 'groove');
    if (seg.type === 'title' && crossed(1.5)) Sound.whoosh(2.3);
    if (seg.type === 'scene') {
      const s = SCENES[seg.k];
      if (s.stamp && crossed(3.15)) Sound.stampHit();
      if (s.fx === 'shake' && crossed(.35)) Sound.rumble(1.8);
      if (s.fx === 'virus' && crossed(.35)) Sound.heartbeat(3);
    }
    prevSeg = i; prevTau = tau;
  }

  function render() {
    const { i, tau } = locate(Math.min(t, TOTAL - 1e-6));
    const seg = SEGS[i];
    const ci = seg.type === 'scene' ? seg.k : seg.type === 'end' ? SCENES.length - 1 : -1;
    if (ci !== curContent) setContent(ci);
    cues(i, tau);

    let v = Y1, lane = { jp: [0, 0], us: [0, 0], de: [0, 0] }, capO = 0, capY = 0, rangeO = 1, linkP = 0, stampS = 0, stampO = 0;
    let dark = 0, sx = 0, sy = 0, titleO = 0, titleY = 0, endO = 0, virus = 0, beat = 0;

    if (seg.type === 'title') {
      titleO = 1 - easeInOut(clamp((tau - 1.0) / .7));
      titleY = -60 * MOVE * easeIn(clamp((tau - 1.0) / .7));
      v = Y1 - SPAN * easeInOut(clamp((tau - 1.5) / 2.3));
      capO = clamp((tau - 1.6) / .3) * (1 - clamp((tau - (seg.dur - .35)) / .3));
      range.textContent = tau < 1.5 ? L.ui.today : (v > Y0 + .5 ? L.ui.rewind : '');
      rangeO = 1;
      if (t === 0 && !playing) { titleO = 1; titleY = 0; }
    } else if (seg.type === 'scene') {
      const s = SCENES[seg.k], D = seg.dur, last = seg.k === SCENES.length - 1;
      const prev = seg.k === 0 ? Y0 : SCENES[seg.k - 1].year;
      v = prev + (s.year - prev) * easeInOut(clamp(tau / .9));
      const exit = last ? 0 : easeIn(clamp((tau - (D - .42)) / .42));
      const order = s.order || REGIONS;
      REGIONS.forEach(r => {
        const e = easeOut(clamp((tau - (.35 + .7 * order.indexOf(r))) / .5));
        const at = .35 + .7 * order.indexOf(r);
        const draw = RM ? e : easeInOut(clamp((tau - at - .15) / 1.1));
        lane[r] = [e * (1 - exit), ((1 - e) * 56 - exit * 40) * MOVE, draw, clamp((tau - at - .95) / .5),
          RM ? 1 : easeInOut(clamp((tau - at - .3) / 1.5)), clamp((tau - at - 1.3) / .6), RM ? 0 : clamp(tau / D)];
      });
      const ce = easeOut(clamp((tau - 2.45) / .45));
      capO = ce * (1 - exit); capY = (1 - ce) * 14 * MOVE;
      rangeO = clamp((tau - .45) / .35) * (1 - exit);
      linkP = s.link ? easeOut(clamp((tau - 2.7) / .55)) * (1 - exit) : 0;
      if (s.stamp) { const k = clamp((tau - 3.15) / .32); stampS = RM ? 1 : (k > 0 ? 1.7 - .7 * easeBack(k) : 1.7); stampO = (k > 0 ? Math.min(1, k * 3) : 0) * (1 - exit); }
      if (s.fx === 'dark') dark = clamp(tau / .9) * (1 - clamp((tau - (D - .7)) / .7));
      if (s.fx === 'virus' && MOVE) {
        // particles drift in for about 3.5 s while the frame throbs like a heartbeat
        virus = clamp((tau - .3) / .6) * (1 - clamp((tau - 2.9) / 1.1));
        if (tau > .35 && tau < 2.8) beat = Math.pow(Math.max(0, Math.sin((tau - .35) * Math.PI / .82)), 12);
      }
      if (s.fx === 'shake' && MOVE && tau > .35 && tau < 2.1) {
        const a = 9 * (1 - (tau - .35) / 1.75); sx = a * Math.sin(tau * 57); sy = a * .6 * Math.cos(tau * 43);
      }
    } else { // end
      const s = SCENES[SCENES.length - 1];
      v = s.year;
      REGIONS.forEach(r => lane[r] = [1, 0, 1, 1, 1, 1, RM ? 0 : 1]);
      capO = 1; rangeO = 1;
      endO = easeOut(clamp((tau - .2) / .8));
    }

    setOdo(v);
    setEras(v);
    range.style.opacity = rangeO;
    const illK = stage.classList.contains('portrait') ? .3 : 1;
    REGIONS.forEach(r => {
      const [o, x, draw = 0, fill = 0, mdraw = 0, mfill = 0, kb = 0] = lane[r], c = cards[r];
      if (c.mkind) {
        c.media.style.opacity = o.toFixed(3);
        if (c.kbImg) c.kbImg.style.transform = `scale(${(1.03 + .09 * kb).toFixed(4)})`; else if (c.svg) { c.svg.style.setProperty('--draw', (1 - mdraw).toFixed(3)); c.svg.style.setProperty('--fill', mfill.toFixed(3)); }
      } else c.media.style.opacity = 0;
      c.el.style.opacity = o.toFixed(3);
      c.el.style.transform = `translateX(${x.toFixed(1)}px)`;
      if (c.art) {
        c.ill.style.opacity = (o * illK).toFixed(3);
        c.ill.style.setProperty('--draw', (1 - draw).toFixed(3));
        c.ill.style.setProperty('--fill', fill.toFixed(3));
        c.ill.classList.toggle('drawing', draw < .999);
      } else c.ill.style.opacity = 0;
    });
    caption.style.opacity = capO.toFixed(3);
    caption.style.transform = `translateY(${capY.toFixed(1)}px)`;
    if (linkLen) { linkPath.style.strokeDashoffset = linkShade.style.strokeDashoffset = (linkLen * (1 - linkP)).toFixed(1); linkDots.style.opacity = clamp((linkP - .6) / .4); }
    const sRot = stage.classList.contains('portrait') ? '' : 'translateY(-50%) ';
    stamp.style.opacity = stampO.toFixed(3);
    stamp.style.transform = `${sRot}rotate(-7deg) scale(${stampS.toFixed(3)})`;
    stage.style.setProperty('--d', dark.toFixed(3));
    shaker.style.transform = (sx || sy) ? `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px)` : beat ? `scale(${(1 + .012 * beat).toFixed(4)})` : '';
    drawVirus(virus, tau);
    titleCard.style.opacity = titleO.toFixed(3);
    titleCard.style.transform = `translateY(${titleY.toFixed(1)}px)`;
    titleCard.style.visibility = titleO > .002 ? 'visible' : 'hidden';
    endCard.style.opacity = endO.toFixed(3);
    endCard.style.visibility = endO > .002 ? 'visible' : 'hidden';
    playhead.style.left = ((clamp(v, Y0, Y1) - Y0) / SPAN * 100) + '%';
    tracksEl.setAttribute('aria-valuenow', Math.round(v));
    setDots(ci);

    // controls
    if (!dragging) scrub.value = Math.round(t / TOTAL * 1000);
    clock.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
  }

  // ---- virus effect (COVID scene): spiky particles on a canvas, positions derived from time so seeking works ----
  const fxCanvas = $('fxCanvas'), fx2 = fxCanvas.getContext('2d');
  let fxDirty = false;
  const PARTICLES = Array.from({ length: 26 }, (_, n) => {
    const r = q => { const x = Math.sin(n * 12.9898 + q * 78.233) * 43758.5453; return x - Math.floor(x); };
    return { x: r(1), y: r(2), size: 14 + r(3) * 30, vx: (r(4) - .5) * .05, vy: -.02 - r(5) * .05, spin: (r(6) - .5) * 1.4, ph: r(7) * 6.28 };
  });
  function virusShape(c, x, y, rad, rot, alpha) {
    c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha = alpha;
    c.strokeStyle = '#c23a25'; c.lineWidth = rad * .13; c.lineCap = 'round'; c.fillStyle = '#ef7a5e';
    for (let k = 0; k < 12; k++) {
      const a = k / 12 * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      c.beginPath(); c.moveTo(ca * rad * .85, sa * rad * .85); c.lineTo(ca * rad * 1.32, sa * rad * 1.32); c.stroke();
      c.beginPath(); c.arc(ca * rad * 1.4, sa * rad * 1.4, rad * .17, 0, Math.PI * 2); c.fill();
    }
    const g = c.createRadialGradient(-rad * .35, -rad * .35, rad * .1, 0, 0, rad);
    g.addColorStop(0, '#ffd9cc'); g.addColorStop(.55, '#e2563d'); g.addColorStop(1, '#8d1f12');
    c.beginPath(); c.arc(0, 0, rad, 0, Math.PI * 2); c.fillStyle = g; c.fill();
    c.fillStyle = 'rgba(255,214,200,.55)';
    for (let k = 0; k < 5; k++) { const a = k * 2.4 + .5; c.beginPath(); c.arc(Math.cos(a) * rad * .5, Math.sin(a) * rad * .5, rad * .1, 0, Math.PI * 2); c.fill(); }
    c.restore();
  }
  function drawVirus(level, tau) {
    if (level <= 0) { if (fxDirty) { fx2.clearRect(0, 0, fxCanvas.width, fxCanvas.height); fxDirty = false; } return; }
    const W = fxCanvas.width, H = fxCanvas.height, k = W / stage.offsetWidth;
    fx2.clearRect(0, 0, W, H); fxDirty = true;
    const vg = fx2.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
    vg.addColorStop(0, 'rgba(160,20,10,0)'); vg.addColorStop(1, `rgba(160,20,10,${(.32 * level).toFixed(3)})`);
    fx2.fillStyle = vg; fx2.fillRect(0, 0, W, H);
    PARTICLES.forEach(p => {
      const x = ((p.x + p.vx * tau + Math.sin(tau * .9 + p.ph) * .015) % 1 + 1) % 1 * W;
      const y = ((p.y + p.vy * tau) % 1 + 1) % 1 * H;
      virusShape(fx2, x, y, p.size * k * (.85 + .15 * Math.sin(tau * 2 + p.ph)), p.ph + tau * p.spin, .78 * level);
    });
  }

  // ---- playback ----
  const scrub = $('scrub'), clock = $('clock'), playBtn = $('playBtn'), playIcon = $('playIcon'), playLabel = $('playLabel'), speedBtn = $('speedBtn');
  const soundBtn = $('soundBtn'), soundIcon = $('soundIcon');
  const PLAY_D = 'M7 4.5v15l13-7.5z', PAUSE_D = 'M6 4.5h4.2v15H6zm7.8 0H18v15h-4.2z';
  const SOUND_ON = 'M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z';
  const SOUND_OFF = 'M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z';
  let soundOn = store.get('three-clocks-sound') !== 'off';
  function updatePlayButton() {
    const c = L.ui.controls;
    playIcon.setAttribute('d', playing ? PAUSE_D : PLAY_D);
    playLabel.textContent = playing ? c.pause : c.play;
    playBtn.setAttribute('aria-label', playing ? c.pause : c.play);
  }
  function updateSound() {
    soundIcon.setAttribute('d', soundOn ? SOUND_ON : SOUND_OFF);
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    Sound.setEnabled(soundOn);
  }
  function setPlaying(p) {
    if (p && t >= TOTAL - .01) t = 0;
    playing = p; lastNow = null; dirty = true;
    if (p) Sound.start();
    updatePlayButton();
  }
  function frame(now) {
    if (playing) {
      if (lastNow !== null) t += Math.min(.1, (now - lastNow) / 1000) * speed;
      lastNow = now;
      if (t >= TOTAL) { t = TOTAL; render(); setPlaying(false); }
      dirty = true;
    }
    if (dirty) { render(); dirty = false; }
    requestAnimationFrame(frame);
  }
  function seekSeg(i) {
    i = clamp(i, 0, SEGS.length - 1);
    const s = SEGS[i];
    t = playing ? s.start : s.start + (s.type === 'scene' ? Math.min(s.dur - .5, 3.7) : s.type === 'end' ? s.dur : 0);
    if (!playing && s.type === 'title') t = 0;
    dirty = true;
  }
  function seekYear(y) {
    let best = 0, bd = Infinity;
    SCENES.forEach((s, k) => { const d = Math.abs(s.year - y); if (d < bd) { bd = d; best = k; } });
    seekSeg(best + 1);
  }

  playBtn.addEventListener('click', () => setPlaying(!playing));
  $('bigPlay').addEventListener('click', e => { e.stopPropagation(); setPlaying(true); });
  $('replay').addEventListener('click', e => { e.stopPropagation(); t = 0; setPlaying(true); });
  [$('endCredits'), $('tcCredits')].forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openCredits(true); }));
  $('crClose').addEventListener('click', e => { e.stopPropagation(); openCredits(false); });
  creditsCard.addEventListener('click', e => e.stopPropagation());
  creditsCard.addEventListener('keydown', e => { if (e.key === 'Escape') openCredits(false); e.stopPropagation(); });
  $('prevBtn').addEventListener('click', () => { const { i, tau } = locate(Math.min(t, TOTAL - 1e-6)); seekSeg(tau > 1.6 && playing ? i : i - 1); });
  $('nextBtn').addEventListener('click', () => { const { i } = locate(Math.min(t, TOTAL - 1e-6)); seekSeg(i + 1); });
  const SPEEDS = [1, 1.5, 2, .75];
  speedBtn.addEventListener('click', () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; speedBtn.textContent = speed + '×'; Sound.setSpeed(speed); });
  soundBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('three-clocks-sound', soundOn ? 'on' : 'off'); updateSound(); });
  scrub.addEventListener('pointerdown', () => dragging = true);
  window.addEventListener('pointerup', () => dragging = false);
  scrub.addEventListener('input', () => { t = scrub.value / 1000 * TOTAL; dirty = true; });
  stage.addEventListener('click', e => {
    if (e.target.closest('.tracks, button')) return;
    if (t === 0 && !playing) return;
    setPlaying(!playing);
  });
  tracksEl.addEventListener('click', e => {
    e.stopPropagation();
    const r = tracksEl.getBoundingClientRect();
    seekYear(Y0 + clamp((e.clientX - r.left) / r.width) * SPAN);
  });
  tracksEl.addEventListener('keydown', e => {
    const { i } = locate(Math.min(t, TOTAL - 1e-6));
    if (e.key === 'ArrowRight') { seekSeg(i + 1); e.preventDefault(); e.stopPropagation(); }
    if (e.key === 'ArrowLeft') { seekSeg(i - 1); e.preventDefault(); e.stopPropagation(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea') || e.defaultPrevented) return;
    const { i } = locate(Math.min(t, TOTAL - 1e-6));
    if (e.key === ' ' || e.key === 'k') { if (e.target.closest('button')) return; setPlaying(!playing); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { seekSeg(i + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { seekSeg(i - 1); e.preventDefault(); }
    else if (e.key === 'm') { soundBtn.click(); }
  });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1).toLowerCase(); if (I18N[h]) setLang(h, true); });

  // ---- full screen ----
  const fsBtn = $('fsBtn'), app = $('app');
  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    const p = document.fullscreenElement ? document.exitFullscreen() : app.requestFullscreen();
    if (p && p.catch) p.catch(() => { fsBtn.hidden = true; });
  });

  // ---- layout: pick landscape or portrait canvas, scale to fit ----
  let orient = null;
  function layout() {
    const root = getComputedStyle(document.documentElement);
    const safe = (parseFloat(root.paddingTop) || 0) + (parseFloat(root.paddingBottom) || 0);
    const fs = !!document.fullscreenElement;
    const aw = Math.max(240, (fs ? window.innerWidth : document.documentElement.clientWidth) - 32);
    controls.style.width = aw + 'px';
    const ah = Math.max(240, window.innerHeight - 32 - safe - controls.offsetHeight - 10);
    const sL = Math.min(aw / DIMS.land.w, ah / DIMS.land.h);
    const sP = Math.min(aw / DIMS.port.w, ah / DIMS.port.h);
    const o = (25 * sP > 20 * sL * 1.12) ? 'port' : 'land';
    const s = o === 'port' ? sP : sL;
    const { w, h } = DIMS[o];
    if (o !== orient) {
      orient = o;
      stage.classList.toggle('portrait', o === 'port');
      stage.style.width = w + 'px'; stage.style.height = h + 'px';
      fxCanvas.width = Math.round(w * 1.5); fxCanvas.height = Math.round(h * 1.5); fxDirty = true;
      buildMap(o === 'port' ? w - 48 - 102 : w - 56 - 94, o === 'port' ? 12 : 10.5);
      REGIONS.forEach(r => eraIdx[r] = -1);
      curContent = null;
    }
    stage.style.transform = `scale(${s})`;
    viewport.style.width = Math.floor(w * s) + 'px';
    viewport.style.height = Math.floor(h * s) + 'px';
    controls.style.width = Math.max(Math.floor(w * s), Math.min(aw, 360)) + 'px';
    dirty = true;
  }
  window.addEventListener('resize', layout);
  document.addEventListener('fullscreenchange', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { curContent = null; dirty = true; });

  // hook for local previews and tests
  window.__film = { seek: s => { t = s; dirty = true; render(); }, setLang: c => { setLang(c); render(); }, total: TOTAL, segs: SEGS };

  preload(0); preload(1);
  langButtons($('langs'));
  langButtons($('tcLangs'));
  setLang(pickInitialLang(), false);
  updateSound();
  layout();
  render();
  requestAnimationFrame(frame);
})();
</script>
